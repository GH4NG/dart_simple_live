repository: https://github.com/xiaoyaocz/dart_simple_live
publish_to: 'none'
environment:
    sdk: '>=3.10.0'

dependencies:
    flutter:
        sdk: flutter
    dio: ^5.9.0
    logger: ^2.6.2
    web_socket_channel: ^3.0.3
    html_unescape: ^2.0.0
