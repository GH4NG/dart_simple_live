name: Build simple_live_app

on:
    push:
        tags:
            - 'v*'
        branches:
            - master
    pull_request:
        paths:
            - pubspec.yaml
            - .github/workflows/build.yaml
            - .fvmrc
        types:
            - opened
            - reopened
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:
        inputs:
            build_type:
                description: 'Build type (release, nightly)'
                required: false
                default: 'nightly'
                type: choice
                options:
                    - release
                    - nightly

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    APP_NAME: simple_live_app
    NIGHTLY_TAG: nightly

jobs:
    prepare:
        name: 准备构建
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check.outputs.should_run }}
            build_type: ${{ steps.check.outputs.build_type }}
            version_name: ${{ steps.fetch.outputs.version_name }}
            flutter_version: ${{ steps.fetch.outputs.flutter_version }}
            nightly_version: ${{ steps.fetch.outputs.nightly_version }}
        steps:
            - name: 签出代码
              uses: actions/checkout@v6
              with: { fetch-depth: 0 }

            - name: 检查构建类型
              id: check
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    BUILD_TYPE="${{ github.event.inputs.build_type }}"
                  elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
                    BUILD_TYPE="release"
                  elif [[ "${{ github.event_name }}" == "schedule" ]]; then
                    COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
                    if [[ $COMMITS_LAST_24H -gt 0 ]]; then
                      BUILD_TYPE="nightly"
                    else
                      echo "should_run=false" >> $GITHUB_OUTPUT
                      exit 0
                    fi
                  else
                    echo "should_run=false" >> $GITHUB_OUTPUT
                    BUILD_TYPE="development"
                  fi

                  echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
                  echo "should_run=true" >> $GITHUB_OUTPUT
                  echo "Build type determined: ${BUILD_TYPE}"

            - name: 获取版本信息
              id: fetch
              run: |
                  VERSION=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
                  FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)

                  echo "version_name=$VERSION" >> $GITHUB_OUTPUT
                  echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

                  if [[ "${{ steps.check.outputs.build_type }}" == "nightly" ]]; then
                    echo "nightly_version=${VERSION}-nightly" >> $GITHUB_OUTPUT
                  fi

    build-app:
        name: 构建应用(${{ matrix.platform }})
        needs: [prepare]
        if: needs.prepare.outputs.should_run == 'true'
        strategy:
            matrix:
                include:
                    - platform: linux
                      os: ubuntu-latest

                    - platform: windows
                      os: windows-2022

                    - platform: macos
                      os: macos-26

                    - platform: android
                      os: ubuntu-latest

                    - platform: ios
                      os: macos-26

        runs-on: ${{ matrix.os }}
        container: ${{ matrix.platform == 'linux' && 'archlinux:base-devel' || null }}
        continue-on-error: true

        steps:
            - name: 检出代码
              uses: actions/checkout@v6

            - name: 安装系统依赖
              if: startsWith(matrix.platform,'linux')
              run: |
                  pacman -Syu --noconfirm
                  pacman -S --noconfirm jq git clang cmake ninja wget patchelf unzip

            - name: 配置 Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version: ${{ needs.prepare.outputs.flutter_version }}
                  cache: true

            - name: 配置 fastforge
              run: |
                  git config --global --add safe.directory '*'
                  git clone https://github.com/GH4NG/fastforge.git
                  cd fastforge
                  dart pub global activate melos
                  melos bootstrap
                  melos run activate

            - name: 写入 Android keystore
              if: startsWith(matrix.platform,'android')
              run: |
                  echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/key.jks
                  echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
                  echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
                  echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

            - name: 安装项目依赖
              run: dart run scripts/prebuild.dart ${{ matrix.platform }}

            - name: 构建应用
              run: dart run scripts/build.dart ${{ matrix.platform }}
              env:
                  CHANNEL: ${{ needs.prepare.outputs.build_type == 'nightly' && 'nightly' || 'release' }}

            - name: 上传构建产物
              uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.platform }}
                  path: dist/**/*

    create-release:
        name: 发布构建
        needs: [prepare, build-app]
        runs-on: ubuntu-latest
        if: needs.prepare.outputs.build_type == 'release' || needs.prepare.outputs.build_type == 'nightly'
        permissions:
            contents: write

        steps:
            - name: 检出代码
              uses: actions/checkout@v6
              with: { fetch-depth: 0 }

            - name: 设置版本变量
              id: ver
              run: |
                  if [[ "${{ needs.prepare.outputs.build_type }}" == "nightly" ]]; then
                    echo "version=${{ needs.prepare.outputs.nightly_version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=${{ needs.prepare.outputs.version_name }}" >> $GITHUB_OUTPUT
                  fi

            - name: 删除现有 nightly 发布
              if: needs.prepare.outputs.build_type == 'nightly'
              run: |
                  # Delete existing nightly release and tag with better error handling
                  echo "Checking for existing nightly release..."
                  if gh release view ${{ env.NIGHTLY_TAG }} >/dev/null 2>&1; then
                    echo "Deleting existing nightly release..."
                    gh release delete ${{ env.NIGHTLY_TAG }} --yes --cleanup-tag
                  else
                    echo "No existing nightly release found."
                  fi

                  # Clean up any orphaned tags
                  if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
                    echo "Deleting orphaned nightly tag..."
                    git push origin --delete ${{ env.NIGHTLY_TAG }} || true
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 生成变更日志
              if: needs.prepare.outputs.build_type == 'nightly'
              id: changelog
              run: |
                  # Get the latest stable release tag for comparison
                  LATEST_STABLE_RELEASE=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1 || echo "")

                  # Create new changelog with comparison link
                  cat > changelog.md <<-EOF
                  # $(date -u "+%Y-%m-%d %H:%M:%S UTC")

                  这是一个自动生成的 nightly 构建版本，包含 develop 分支中的最新更改。

                  ⚠️ **注意：这是开发构建版本，可能包含错误或未完成的功能。**
                  EOF

                  # Add comparison link if we have a latest stable release
                  if [ -n "$LATEST_STABLE_RELEASE" ]; then
                    cat >> changelog.md <<-EOF

                  ## 📋 更新内容

                  查看自上一个正式版本以来的所有变更： [比较 $LATEST_STABLE_RELEASE...HEAD](https://github.com/${{ github.repository }}/compare/$LATEST_STABLE_RELEASE...HEAD)
                  EOF
                  else
                    cat >> changelog.md <<-EOF

                  ## 📋 更新内容

                  查看所有更改： [查看提交历史](https://github.com/${{ github.repository }}/commits/develop)
                  EOF
                  fi

                  # Add build metadata
                  cat >> changelog.md <<-EOF

                  ---

                  📅 **构建时间：** $(date -u "+%Y-%m-%d %H:%M:%S UTC")
                  📝 **提交哈希：** ${{ github.sha }}
                  🌿 **分支：** develop
                  EOF

                  echo "changelog_file=changelog.md" >> $GITHUB_OUTPUT
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 下载构建产物
              uses: actions/download-artifact@v7
              with:
                  path: artifacts

            - name: 创建 GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.prepare.outputs.build_type == 'nightly' && env.NIGHTLY_TAG || github.ref_name }}
                  name: ${{ needs.prepare.outputs.build_type == 'nightly' && format('Nightly Build - {0}', steps.ver.outputs.version) || '' }}
                  body_path: ${{ needs.prepare.outputs.build_type == 'nightly' && 'changelog.md' || '' }}
                  draft: ${{ needs.prepare.outputs.build_type == 'release' }}
                  prerelease: ${{ needs.prepare.outputs.build_type == 'nightly' }}
                  make_latest: ${{ needs.prepare.outputs.build_type == 'release' }}
                  generate_release_notes: ${{ needs.prepare.outputs.build_type == 'release' }}
                  fail_on_unmatched_files: true
                  files: artifacts/**/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
