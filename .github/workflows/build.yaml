name: Build simple_live_app

on:
    push:
        tags:
            - 'v*'
        branches:
            - master
    pull_request:
        paths:
            - pubspec.yaml
            - .github/workflows/build.yml
            - .fvmrc
        types:
            - opened
            - reopened
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:
        inputs:
            build_type:
                description: 'Build type (release, nightly)'
                required: false
                default: 'nightly'
                type: choice
                options:
                    - release
                    - nightly

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    APP_NAME: simple_live_app
    NIGHTLY_TAG: nightly

jobs:
    check-trigger:
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.check.outputs.should_run }}
            build_type: ${{ steps.check.outputs.build_type }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with: { fetch-depth: 0 }

            - name: Check if should run and determine build type
              id: check
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    BUILD_TYPE="${{ github.event.inputs.build_type }}"
                  elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
                    BUILD_TYPE="release"
                  elif [[ "${{ github.event_name }}" == "schedule" ]]; then
                    # Check if there were commits to develop in the last 24 hours
                    git checkout develop
                    COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
                    if [[ $COMMITS_LAST_24H -gt 0 ]]; then
                      BUILD_TYPE="nightly"
                    else
                      echo "No commits to develop in the last 24 hours, skipping nightly build"
                      echo "should_run=false" >> $GITHUB_OUTPUT
                      exit 0
                    fi
                  else
                    # For PRs and other events, build but don't release
                    BUILD_TYPE="development"
                  fi

                  echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
                  echo "should_run=true" >> $GITHUB_OUTPUT
                  echo "Build type determined: ${BUILD_TYPE}"

    fetch-info:
        needs: [check-trigger]
        if: needs.check-trigger.outputs.should_run == 'true'
        runs-on: ubuntu-latest
        outputs:
            version_name: ${{ steps.fetch.outputs.version_name }}
            flutter_version: ${{ steps.fetch.outputs.flutter_version }}
            nightly_version: ${{ steps.fetch.outputs.nightly_version }}
            build_type: ${{ needs.check-trigger.outputs.build_type }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with: { fetch-depth: 0 }

            - name: Fetch version name and create nightly version
              id: fetch
              run: |
                  VERSION=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
                  FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)

                  echo "version_name=$VERSION" >> $GITHUB_OUTPUT
                  echo "flutter_version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

                  if [[ "${{ needs.check-trigger.outputs.build_type }}" == "nightly" ]]; then
                    echo "nightly_version=${VERSION}-nightly" >> $GITHUB_OUTPUT
                  fi

    build-app:
        needs: [fetch-info]
        strategy:
            matrix:
                platform: [linux, windows, macos, android, ios]
                include:
                    - platform: linux
                      os: ubuntu-latest
                      targets: appimage,deb,zip
                    - platform: windows
                      os: windows-2022
                      targets: exe,msix,zip
                    - platform: macos
                      os: macos-latest
                      targets: dmg,zip
                    - platform: android
                      os: ubuntu-latest
                      targets: apk
                    - platform: ios
                      os: macos-latest
                      targets: ipa

        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version: ${{ needs.fetch-info.outputs.flutter_version }}

            - name: Set up fastforge
              run: |
                  git clone -b fix/duplicate-library https://github.com/GH4NG/fastforge.git
                  cd fastforge
                  dart pub global activate melos
                  melos bootstrap
                  melos run activate

            - name: Get dependencies
              run: |
                  flutter pub get

            # Platform dependencies
            - name: Get packages
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev patchelf cmake clang libfuse2 pkg-config liblzma-dev mpv libasound2-dev locate libc++1 fuse lld binutils

                  # Install AppImageTool
                  wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
                  chmod +x appimagetool
                  sudo mv appimagetool /usr/local/bin/

            - name: Add Chinese language file for Inno Setup
              if: matrix.platform == 'windows'
              run: Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

            - name: Get packages
              if: matrix.platform == 'macos'
              run: npm install -g appdmg

            - name: Write key
              if: matrix.platform == 'android'
              run: |
                  if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.STORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Build App
              if: matrix.platform != 'windows'
              shell: bash
              run: |
                  if [[ "${{ matrix.platform }}" == "ios" ]]; then
                    flutter build ios --release --no-codesign
                    cd build/ios/iphoneos
                    mkdir -p Payload
                    mv Runner.app Payload/
                    zip -r iOS.ipa Payload
                  elif [[ "${{ matrix.platform }}" == "android" ]]; then
                    fastforge package --platform android --targets ${{ matrix.targets }} --flutter-build-args=split-per-abi
                  else
                    fastforge package --platform ${{ matrix.platform }} --targets ${{ matrix.targets }}
                  fi

            - name: Build App
              if: matrix.platform == 'windows'
              shell: pwsh
              run: fastforge package --platform $env:MATRIX_PLATFORM --targets $env:MATRIX_TARGETS
              env:
                  MATRIX_PLATFORM: ${{ matrix.platform }}
                  MATRIX_TARGETS: ${{ matrix.targets }}

            - name: Rename artifacts
              shell: bash
              run: |
                  VERSION="${{ needs.fetch-info.outputs.build_type == 'nightly' && needs.fetch-info.outputs.nightly_version || needs.fetch-info.outputs.version_name }}"
                  PLATFORM="${{ matrix.platform }}"
                  APP="${APP_NAME}"
                  OUT="renamed"
                  mkdir -p "$OUT"

                  # Android ABI rename
                  if [[ "$PLATFORM" == "android" ]]; then
                    APK_DIR="build/app/outputs/flutter-apk"

                    declare -A ABI_MAP=(
                      ["app-arm64-v8a-release.apk"]="arm64-v8a"
                      ["app-armeabi-v7a-release.apk"]="armeabi-v7a"
                      ["app-x86_64-release.apk"]="x86_64"
                    )

                    for FILE in "${!ABI_MAP[@]}"; do
                      SRC="$APK_DIR/$FILE"
                      if [[ -f "$SRC" ]]; then
                        ABI="${ABI_MAP[$FILE]}"
                        NEW="${APP}-android-${ABI}-${VERSION}.apk"
                        cp "$SRC" "$OUT/$NEW"
                      fi
                    done
                    exit 0
                  fi

                  # iOS
                  if [[ "$PLATFORM" == "ios" ]]; then
                    SRC="build/ios/iphoneos/iOS.ipa"
                    NEW="${APP}-ios-${VERSION}.ipa"
                    cp "$SRC" "$OUT/$NEW"
                    exit 0
                  fi

                  # Other platforms
                  for f in dist/**/*; do
                    [[ -f "$f" ]] || continue
                    EXT="${f##*.}"
                    NEW="${APP}-${PLATFORM}-${VERSION}.${EXT}"
                    cp "$f" "$OUT/$NEW"
                  done

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: simple_live_app-${{ matrix.platform }}
                  path: renamed/*

    create-release:
        needs: [fetch-info, build-app]
        runs-on: ubuntu-latest
        if: needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly'
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with: { fetch-depth: 0 }

            - name: Set version variables
              id: ver
              run: |
                  if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
                    echo "version=${{ needs.fetch-info.outputs.nightly_version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=${{ needs.fetch-info.outputs.version_name }}" >> $GITHUB_OUTPUT
                  fi

            - name: Delete existing nightly release
              if: needs.fetch-info.outputs.build_type == 'nightly'
              run: |
                  # Delete existing nightly release and tag with better error handling
                  echo "Checking for existing nightly release..."
                  if gh release view ${{ env.NIGHTLY_TAG }} >/dev/null 2>&1; then
                    echo "Deleting existing nightly release..."
                    gh release delete ${{ env.NIGHTLY_TAG }} --yes --cleanup-tag
                  else
                    echo "No existing nightly release found."
                  fi

                  # Clean up any orphaned tags
                  if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
                    echo "Deleting orphaned nightly tag..."
                    git push origin --delete ${{ env.NIGHTLY_TAG }} || true
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate changelog
              if: needs.fetch-info.outputs.build_type == 'nightly'
              id: changelog
              run: |
                  # Get the latest stable release tag for comparison
                  LATEST_STABLE_RELEASE=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1 || echo "")

                  # Create new changelog with comparison link
                  cat > changelog.md <<-EOF
                  # $(date -u "+%Y-%m-%d %H:%M:%S UTC")

                  这是一个自动生成的 nightly 构建版本，包含 develop 分支中的最新更改。

                  ⚠️ **注意：这是开发构建版本，可能包含错误或未完成的功能。**
                  EOF

                  # Add comparison link if we have a latest stable release
                  if [ -n "$LATEST_STABLE_RELEASE" ]; then
                    cat >> changelog.md <<-EOF

                  ## 📋 更新内容

                  查看自上一个正式版本以来的所有变更： [比较 $LATEST_STABLE_RELEASE...HEAD](https://github.com/${{ github.repository }}/compare/$LATEST_STABLE_RELEASE...HEAD)
                  EOF
                  else
                    cat >> changelog.md <<-EOF

                  ## 📋 更新内容

                  查看所有更改： [查看提交历史](https://github.com/${{ github.repository }}/commits/develop)
                  EOF
                  fi

                  # Add build metadata
                  cat >> changelog.md <<-EOF

                  ---

                  📅 **构建时间：** $(date -u "+%Y-%m-%d %H:%M:%S UTC")
                  📝 **提交哈希：** ${{ github.sha }}
                  🌿 **分支：** develop
                  EOF

                  echo "changelog_file=changelog.md" >> $GITHUB_OUTPUT
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Download Artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && env.NIGHTLY_TAG || github.ref_name }}
                  name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && format('Nightly Build - {0}', steps.ver.outputs.version) || '' }}
                  body_path: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'changelog.md' || '' }}
                  draft: ${{ needs.fetch-info.outputs.build_type == 'release' }}
                  prerelease: ${{ needs.fetch-info.outputs.build_type == 'nightly' }}
                  make_latest: ${{ needs.fetch-info.outputs.build_type == 'release' }}
                  generate_release_notes: ${{ needs.fetch-info.outputs.build_type == 'release' }}
                  fail_on_unmatched_files: true
                  files: artifacts/**/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
